openapi: 3.1.0
info:
  title: MCP-One Nexus-Facing API
  version: 0.1.0
  summary: External contract for Nexus to consume MCP-One
  description: >
    This contract defines the Nexus-facing surface of MCP-One.
    It focuses on the operational orchestration endpoint and excludes
    internal debug, registry, metrics, and maintenance routes.

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: health
    description: Health endpoints
  - name: orchestration
    description: Nexus-facing orchestration endpoints

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /orchestrate:
    post:
      tags: [orchestration]
      summary: Resolve a user request into an orchestration response
      operationId: orchestrate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrchestrationInput'
      responses:
        '200':
          description: Orchestration result for Nexus consumption
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationOutput'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        service:
          type: string
          example: MCP-One
        version:
          type: string
          example: 0.2.0
        env:
          type: string
          example: local
        active_provider:
          type: string
          example: none
      required:
        - ok
        - service
        - version
        - env
        - active_provider

    OrchestrationInput:
      type: object
      properties:
        user_input:
          type: string
          description: Raw input text to orchestrate
          example: Help me validate a CURP in Mexico
        intent_family:
          type: string
          nullable: true
          description: Optional explicit intent family hint
        allowed_modules:
          type: array
          items:
            type: string
          default: []
          description: Optional module whitelist for resolution
        client_context:
          type: object
          additionalProperties: true
          default: {}
          description: Client metadata such as source, channel, tenant, or session_id
        request_id:
          type: string
          nullable: true
          description: Optional external request identifier supplied by Nexus
      required:
        - user_input

    NextStep:
      type: object
      properties:
        type:
          type: string
          example: execute
        module:
          type: string
          nullable: true
          example: curpify
        reason:
          type: string
          nullable: true
          example: Módulo recomendado para continuar el flujo.
      required:
        - type

    OrchestrationOutput:
      type: object
      properties:
        request_id:
          type: string
          nullable: true
          description: Request identifier generated by MCP-One or supplied by Nexus
        status:
          type: string
          nullable: true
          example: resolved
          description: High-level operational status of the resolution
        mode:
          type: string
          enum:
            - module_recommendation
            - capability_explanation
            - summary
            - composed_summary
            - handoff
            - preview
        modules_used:
          type: array
          items:
            type: string
        capabilities_used:
          type: array
          items:
            type: string
        summary:
          type: string
          description: Main user-facing orchestration summary
        insight:
          type: string
          nullable: true
          description: Secondary interpretation or contextual guidance
        recommended_module:
          type: string
          nullable: true
          description: Primary recommended module for the request
        next_step:
          $ref: '#/components/schemas/NextStep'
        handoff:
          type: boolean
        restrictions:
          type: array
          items:
            type: string
        confidence:
          type: number
          format: float
        matched_patterns:
          type: array
          items:
            type: string
        reason_codes:
          type: array
          items:
            type: string
      required:
        - mode
        - modules_used
        - capabilities_used
        - summary
        - handoff
        - restrictions
        - confidence
        - matched_patterns
        - reason_codes